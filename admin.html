<!doctype html>
<html lang="en" data-surface="dashboard">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StampNote" />
    <title>StampNote photos and attendance</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/stampnote.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/stampnote-180.png" sizes="180x180" />
    <link rel="stylesheet" href="admin.css" />
    <script src="observability.js" defer></script>
    <script src="photo-cloud.js" defer></script>
    <script src="firebase.js" defer></script>
    <script src="admin.js" defer></script>
  </head>
  <body>
    <header class="admin-header">
      <a class="brand" href="index.html" aria-label="Back to StampNote capture">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>StampNote</span>
      </a>
      <div class="account-actions">
        <span class="account-name" id="account-name"></span>
        <button class="button button-quiet" id="sign-out" type="button" hidden>Sign out</button>
      </div>
    </header>

    <main class="admin-main">
      <section class="intro" aria-labelledby="dashboard-title">
        <h1 id="dashboard-title">Photos &amp; attendance</h1>
      </section>

      <p class="dashboard-status" id="dashboard-status" role="status" aria-live="polite"></p>

      <section class="auth-gate" id="auth-gate" aria-labelledby="auth-title">
        <div class="auth-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M7.2 18.5h9.7a3.9 3.9 0 0 0 .6-7.8 5.8 5.8 0 0 0-11-1.6 4.8 4.8 0 0 0 .7 9.4z" />
          </svg>
        </div>
        <h2 id="auth-title">Sign in to the team workspace</h2>
        <p>Sign in with the same Google account used on the capture screen.</p>
        <button class="button button-primary" id="sign-in" type="button">Continue with Google</button>
      </section>

      <div class="dashboard-workspace" id="dashboard-workspace" hidden>
        <section class="dashboard-panel photos-panel" aria-labelledby="photos-title">
          <div class="panel-heading">
            <div>
              <h2 id="photos-title">Photos</h2>
            </div>
            <div class="toolbar" id="gallery-toolbar" hidden>
              <label for="photo-filter">Show</label>
              <select id="photo-filter">
                <option value="all">All reviewed photos</option>
                <option value="kept">Kept photos</option>
                <option value="flagged">AI review bin</option>
              </select>
            </div>
          </div>

          <section class="photo-library" id="photo-library" aria-label="Cloud photos" hidden></section>

          <div class="load-more-row" id="load-more-row" hidden>
            <button class="button button-quiet" id="load-more" type="button">Load more photos</button>
          </div>
        </section>

        <aside class="dashboard-panel attendance-panel" id="attendance-panel" aria-labelledby="attendance-title">
          <div class="panel-heading attendance-heading">
            <div>
              <h2 id="attendance-title">Attendance</h2>
            </div>
            <button class="button button-quiet attendance-refresh" id="attendance-refresh" type="button">
              Refresh
            </button>
          </div>

          <div class="attendance-filter">
            <label for="attendance-worker-filter">Worker</label>
            <select id="attendance-worker-filter" disabled>
              <option value="all">All workers</option>
            </select>
          </div>

          <div class="attendance-summary" aria-label="Attendance summary">
            <div>
              <strong id="present-worker-count">0</strong>
              <span>Workers</span>
            </div>
            <div>
              <strong id="attendance-checkin-count">0</strong>
              <span>Check-ins</span>
            </div>
          </div>

          <p class="attendance-status" id="attendance-status" role="status" aria-live="polite"></p>
          <div class="attendance-list" id="attendance-list"></div>
        </aside>
      </div>
    </main>

    <dialog class="photo-dialog" id="photo-dialog">
      <div class="dialog-body">
        <img id="dialog-image" alt="" />
        <div class="dialog-copy">
          <p class="dialog-location" id="dialog-location"></p>
          <p class="dialog-time" id="dialog-time"></p>
          <p class="dialog-people" id="dialog-people"></p>
          <p class="dialog-review" id="dialog-review"></p>
        </div>
      </div>
      <form method="dialog">
        <button class="button button-quiet" type="submit">Close</button>
      </form>
    </dialog>
  </body>
</html>
