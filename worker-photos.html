<!doctype html>
<html lang="en" data-surface="worker-photos">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1210" media="(prefers-color-scheme: dark)" />
    <title>Worker photos · StampNote</title>
    <link
      rel="preload"
      href="vendor/fonts/outfit-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="vendor/fonts/outfit.css" />
    <link rel="stylesheet" href="sidebar.css" />
    <link rel="stylesheet" href="worker-photos.css" />
    <script src="sidebar.js" defer></script>
    <script src="address-service.js" defer></script>
    <script src="stamp.js" defer></script>
    <script src="photo-store.js" defer></script>
    <script src="photo-cloud.js" defer></script>
    <script src="weather-service.js" defer></script>
    <script src="firebase.js" defer></script>
    <script src="worker-photos.js" defer></script>
  </head>
  <body>
    <header class="photo-header" data-sidebar-mount>
      <div class="account-controls">
        <p id="worker-photo-account">Photos save on this device</p>
        <button class="auth-button" id="worker-photo-auth" type="button">
          Sign in to sync
        </button>
      </div>
    </header>

    <main class="photo-main">
      <!-- The page should still have a heading, and the buttons below are named
           by it, but a phone screen with two buttons on it does not need to be
           told what it is. -->
      <h1 class="visually-hidden" id="worker-photo-title">Add a site photo</h1>

      <!-- Two buttons, and nothing else until there is something to send. What
           the stamp attaches is better learned from the first photo than from a
           paragraph above the button. -->
      <section class="action-card" aria-labelledby="worker-photo-title">
        <div class="photo-actions" id="photo-actions">
          <label class="photo-action primary-action" for="take-photo">
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4.2 8.1h3l1.5-2.2h6.6l1.5 2.2h3a1.7 1.7 0 0 1 1.7 1.7v8.1a1.7 1.7 0 0 1-1.7 1.7H4.2a1.7 1.7 0 0 1-1.7-1.7V9.8a1.7 1.7 0 0 1 1.7-1.7z" />
              <circle cx="12" cy="13.5" r="3.5" />
            </svg>
            <strong>Take photo</strong>
          </label>
          <input
            class="visually-hidden-input"
            id="take-photo"
            type="file"
            accept="image/*"
            capture="environment"
          />

          <label class="photo-action" for="choose-photos">
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="3.2" y="5.2" width="17.6" height="13.6" rx="2.2" />
              <circle cx="8.6" cy="10" r="1.6" />
              <path d="m4.4 17.2 4.5-4.4 3 2.9 3.2-3.4 4.5 4.9" />
            </svg>
            <strong>Choose from gallery</strong>
          </label>
          <input
            class="visually-hidden-input"
            id="choose-photos"
            type="file"
            accept="image/*"
            multiple
          />
        </div>

        <div class="save-status" id="worker-photo-status" data-state="idle" role="status" aria-live="polite" hidden>
          <span class="status-dot" aria-hidden="true"></span>
          <span id="worker-photo-status-text"></span>
        </div>
        <button class="send-button" id="worker-photo-send" type="button" disabled>Send</button>
      </section>
    </main>
  </body>
</html>
